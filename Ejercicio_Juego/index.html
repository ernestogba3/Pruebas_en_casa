<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <main>
        <div id="game-container">
            <div id="info-enemigo" style="padding: 20px; color: white; background: rgba(0,0,0,0.5);">
                <p style="margin: 0; font-size: 1.5rem;">ENEMIGO: <span id="nombre-enemigo"></span></p>
                <p style="margin: 0; font-size: 1.5rem;">VIDA: <span id="vida-enemigo"></span></p>
            </div>

            <div class="pantalla-superior">
                <div id="registro-combate"></div>

                 <div id="stats-container" class="oculto">
                    <h3>Estadisticas</h3>
                    <p>Nombre: <span id="stat-nombre"></span></p>
                    <p>Nivel: <span id="stat-nivel"></span></p>
                    <p>Ataque: <span id="stat-ataque"></span></p>
                    <p>Vida: <span id="stat-vida"></span> / Vmax:<span id="stat-max-vida"></span></p>
                </div>

               
            </div>
            


            <div class="battle-interface">
                <div class="dialog-box">
                    <p id="mensaje_jugador">¿Qué debería hacer <span id="nombre-jugador"></span>?</p>
                </div>

                <div class="commands-container">
                    <div class="action-grid">
                        <button class="btn" id="btn-lucha">ATAQUE</button>
                        <button class="btn" id="btn-defender">DEFENDER</button>
                        <button class="btn" id="btn-bolsa">BOLSA</button>
                        <button class="btn" id="btn-cambio">CAMBIAR</button>
                        <button class="btn" id="btn-stat">ESTADISTICAS</button>
                        <button class="btn" id="levelUp">SUBIR NIVEL</button>

                    </div>
                </div>
            </div>

        </div>
    </main>


    <script src="./assets/js/main.js"></script>
</body>

</html>
