<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <main>
        <div id="game-container">

            <div id="registro-combate">

                 <p id="battle-message">Enemigo:<span id="nombre-enemigo"></span>
                    Vida:<span id="vida-enemigo">

                    </span>?</p>
            </div>


            <div class="battle-interface">
                <div class="dialog-box">
                    <p id="battle-message">¿Qué debería hacer <span id="nombre-jugador"></span>?</p>
                </div>

                <div class="commands-container">
                    <div class="action-grid">
                        <button id="btn-lucha">LUCHAR</button>
                        <button id="btn-defender">DEFENDER</button>
                        <button class="btn bolsa">BOLSA</button>
                        <button id="btn-cambio">CAMBIAR</button>
                        <button class="btn huir">HUIR</button>
                        <button id="levelUp">SUBIR NIVEL</button>

                    </div>
                </div>
            </div>

    </main>


    <script src="./assets/js/main.js"></script>
</body>

</html>
