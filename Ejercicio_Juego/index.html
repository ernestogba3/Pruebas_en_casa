<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>

<body>
    <main>
        <div id="game-container">
            <div id="info-enemigo" class="hud-enemigo-superior">
                <div class="poke-img-container">
                    <img id="poke-img-enemigo" alt="pokemon rival">
                </div>

                <div class="datos-enemigo-text">
                    <p>ENEMIGO:<span id="nombre-enemigo"></span></p>

                    <div class="vida-container">
                        <p>VIDA:<span id="vida-enemigo"></span>/ <span id="vida-max-enemigo"></span> HP</p>
                        </p>

                        <div class="barra-vida-fondo">
                            <div class="barra-vida-relleno" id="barra-vida-enemigo"></div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="pantalla-superior">
                <div id="registro-combate"></div>

                <div id="stats-container" class="oculto">
                    <img id="poke-img" alt="pokemon" style="width: 100px; display: block; margin: 0 auto;" />
                    <h3>Estadisticas</h3>
                    <p><span id="stat-nombre" style="display: flex; justify-content: center;"></span></p>
                    <div style="display: flex;justify-content: space-around;">

                        <p>Nivel: <span id="stat-nivel"></span></p>
                        <p>Tipo: <span id="stat-tipo"></span></p>
                        <p>E.base: <span id="stat-exp"></span></p>
                    </div>

                    <div style="display:flex;justify-content: space-around;">
                        <p>Vida: <span id="stat-vida"></span> / <span id="stat-max-vida"></span></p>
                        <p>Defensa: <span id="stat-defensa"></span></p>
                        <p>D.Esp:<span id="stat-defensa-especial"></span></p>

                    </div>

                    <div style="display: flex;justify-content: space-around;">
                        <p>Ataque: <span id="stat-ataque"></span></p>
                        <p>A.Esp: <span id="stat-ataque-especial"></span></p>
                        <p>Velocidad: <span id="stat-velocidad"></span></p>
                    </div>

                </div>

            </div>

            <div class="battle-interface">

                <div class="dialog-box">
                    <div class="dialog-contenido">
                        <p id="mensaje_jugador">
                            <img id="poke-img-jugador" alt="mi pokemon" />
                            ¿Qué debería hacer <span id="nombre-jugador"></span>?
                        </p>

                        <div class="barra-vida-fondo">
                            <div class="barra-vida-relleno" id="barra-vida-jugador"></div>
                        </div>
                    </div>
                </div>

                <div class="commands-container">
                    <div class="action-grid" id="menu-principal">
                        <button class="btn" id="btn-lucha">LUCHAR</button>
                        <button class="btn" id="btn-bolsa">BOLSA</button>
                        <button class="btn" id="btn-cambio">CAMBIAR</button>
                        <button class="btn" id="btn-stat">ESTADISTICAS</button>
                        <button class="btn" id="levelUp">SUBIR NIVEL</button>
                    </div>

                    <div class="action-grid" id="menu-movimientos" style="display: none;">
                        <button class="btn btn-movimiento" id="mov-0"></button>
                        <button class="btn btn-movimiento" id="mov-1"></button>
                        <button class="btn btn-movimiento" id="mov-2"></button>
                        <button class="btn btn-movimiento" id="mov-3"></button>
                        <button class="btn" id="btn-volver">VOLVER</button>
                    </div>

                    
                    <div id="menu-cambio" style="display:none;">
                        <div id="lista-pokemon-equipo"></div>
                        <button class="btn" id="btn-volver-cambio">⬅ VOLVER</button>
                    </div>
                </div>
            </div>
        </div>


        </div>
    </main>

    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/combate.js"></script>
    <script src="./assets/js/interfaz.js"></script>
    <script src="./assets/js/main.js"></script>
</body>

</html>
